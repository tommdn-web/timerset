<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stage Timer - Gestión de Tiempo para Conferencias</title>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel para transpilar JSX en el navegador -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Tailwind CSS para los estilos -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: ui-sans-serif, system-ui, sans-serif; margin: 0; }
    .timer-display { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden">
  <div id="root" class="h-full w-full"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function App() {
      // Estados del temporizador
      const [duration, setDuration] = useState(600); // en segundos (por defecto 10 min)
      const [timeLeft, setTimeLeft] = useState(600);
      const [isRunning, setIsRunning] = useState(false);
      const [message, setMessage] = useState("");
      const [displayMessage, setDisplayMessage] = useState("");
      
      // Configuración
      const [inputMinutes, setInputMinutes] = useState(10);
      
      // Referencias
      const timerRef = useRef(null);

      // Lógica del temporizador
      useEffect(() => {
        if (isRunning) {
          timerRef.current = setInterval(() => {
            setTimeLeft((prev) => prev - 1);
          }, 1000);
        } else {
          clearInterval(timerRef.current);
        }
        return () => clearInterval(timerRef.current);
      }, [isRunning]);

      // Formatear tiempo (MM:SS o -MM:SS)
      const formatTime = (seconds) => {
        const isNegative = seconds < 0;
        const absSeconds = Math.abs(seconds);
        const m = Math.floor(absSeconds / 60).toString().padStart(2, '0');
        const s = (absSeconds % 60).toString().padStart(2, '0');
        return `${isNegative ? '-' : ''}${m}:${s}`;
      };

      // Determinar color de la pantalla
      const getStageColor = () => {
        if (timeLeft <= 0) return 'text-red-500'; // Tiempo agotado
        if (timeLeft <= duration * 0.2) return 'text-yellow-400'; // 20% restante (Advertencia)
        return 'text-green-400'; // Todo bien
      };

      // Controles
      const handleStart = () => setIsRunning(true);
      const handlePause = () => setIsRunning(false);
      const handleReset = () => {
        setIsRunning(false);
        setTimeLeft(duration);
      };
      
      const handleSetTime = () => {
        const newDuration = inputMinutes * 60;
        setDuration(newDuration);
        setTimeLeft(newDuration);
        setIsRunning(false);
      };

      const handleSendMessage = () => {
        setDisplayMessage(message);
      };

      const handleClearMessage = () => {
        setDisplayMessage("");
        setMessage("");
      };

      return (
        <div class="flex h-full w-full flex-col md:flex-row">
          
          {/* PANEL DE CONTROL (Izquierda) */}
          <div class="w-full md:w-1/3 bg-slate-800 p-6 border-r border-slate-700 flex flex-col gap-6 overflow-y-auto">
            <div>
              <h1 class="text-2xl font-bold text-white mb-1">Panel de Control</h1>
              <p class="text-slate-400 text-sm">Gestiona el temporizador y los mensajes</p>
            </div>

            {/* Ajuste de Tiempo */}
            <div class="bg-slate-700 p-4 rounded-lg shadow-md">
              <h2 class="text-lg font-semibold mb-3">Configurar Tiempo</h2>
              <div class="flex gap-2 items-center">
                <input 
                  type="number" 
                  value={inputMinutes}
                  onChange={(e) => setInputMinutes(e.target.value)}
                  class="bg-slate-900 border border-slate-600 text-white text-lg rounded px-3 py-2 w-24 text-center focus:outline-none focus:border-blue-500"
                  min="1"
                />
                <span class="text-slate-300">minutos</span>
                <button 
                  onClick={handleSetTime}
                  class="ml-auto bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded transition-colors"
                >
                  Aplicar
                </button>
              </div>
            </div>

            {/* Controles de Reproducción */}
            <div class="bg-slate-700 p-4 rounded-lg shadow-md flex flex-col gap-3">
              <h2 class="text-lg font-semibold">Controles</h2>
              <div class="flex gap-2">
                {!isRunning ? (
                  <button onClick={handleStart} class="flex-1 bg-green-600 hover:bg-green-500 text-white font-bold py-3 rounded transition-colors">
                    Iniciar
                  </button>
                ) : (
                  <button onClick={handlePause} class="flex-1 bg-yellow-600 hover:bg-yellow-500 text-white font-bold py-3 rounded transition-colors">
                    Pausar
                  </button>
                )}
                <button onClick={handleReset} class="flex-1 bg-red-600 hover:bg-red-500 text-white font-bold py-3 rounded transition-colors">
                  Reiniciar
                </button>
              </div>
            </div>

            {/* Mensajes a Pantalla */}
            <div class="bg-slate-700 p-4 rounded-lg shadow-md flex flex-col gap-3">
              <h2 class="text-lg font-semibold">Mensaje para el Orador</h2>
              <textarea 
                value={message}
                onChange={(e) => setMessage(e.target.value)}
                placeholder="Ej. ¡5 minutos para preguntas!"
                class="w-full bg-slate-900 border border-slate-600 text-white rounded p-3 focus:outline-none focus:border-blue-500 resize-none h-24"
              ></textarea>
              <div class="flex gap-2">
                <button onClick={handleSendMessage} class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white py-2 rounded transition-colors">
                  Mostrar
                </button>
                <button onClick={handleClearMessage} class="flex-1 bg-slate-600 hover:bg-slate-500 text-white py-2 rounded transition-colors">
                  Ocultar
                </button>
              </div>
            </div>
            
            <div class="mt-auto pt-4 text-xs text-slate-500 text-center">
              Similar a stagetimer.io - Vista simplificada
            </div>
          </div>

          {/* VISTA DEL ESCENARIO (Derecha) */}
          <div class="w-full md:w-2/3 bg-black flex flex-col items-center justify-center relative p-8">
            
            {/* Reloj Principal */}
            <div class={`timer-display text-[15vw] font-bold leading-none tracking-tight transition-colors duration-500 ${getStageColor()}`}>
              {formatTime(timeLeft)}
            </div>
            
            {/* Barra de Progreso Visual */}
            <div class="w-3/4 max-w-3xl h-4 bg-slate-800 rounded-full mt-10 overflow-hidden">
              <div 
                class={`h-full transition-all duration-1000 ${timeLeft <= duration * 0.2 ? (timeLeft <= 0 ? 'bg-red-500' : 'bg-yellow-400') : 'bg-green-400'}`}
                style={{ width: `${Math.max(0, Math.min(100, (timeLeft / duration) * 100))}%` }}
              ></div>
            </div>

            {/* Mensaje en Pantalla */}
            {displayMessage && (
              <div class="absolute bottom-16 left-0 right-0 mx-auto w-3/4 max-w-4xl bg-blue-600 text-white text-4xl md:text-6xl font-bold py-6 px-8 rounded-2xl text-center shadow-2xl animate-pulse">
                {displayMessage}
              </div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
